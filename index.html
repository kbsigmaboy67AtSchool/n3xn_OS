  function blocksiFake() { return (state.settings && state.settings.blocksiFakeSrc) || BLOCKSI_FAKE_SRC; }
  function blocksiProc() { return (state.settings && state.settings.blocksiProcessed) || BLOCKSI_PROC; }

  function scrubBlocksiInDoc(doc) {
    if (!doc) return;
    try {
      doc.querySelectorAll('#__blocksi_iframe_blocked__').forEach(function (n) { n.remove(); });
      doc.querySelectorAll('[id*="blocksi"][id*="blocked"]').forEach(function (n) { n.remove(); });
    } catch (e) {}
  }

  function stompBlocksiAttrs(root) {
    if (!root || !root.querySelectorAll) return;
    var F = blocksiFake(), P = blocksiProc();
    try {
      root.querySelectorAll('iframe, embed').forEach(function (el) {
        try {
          if (el.getAttribute('data-blocksi-src') !== F) el.setAttribute('data-blocksi-src', F);
          if (el.getAttribute('data-blocksi-processed') !== P) el.setAttribute('data-blocksi-processed', P);
        } catch (e) {}
      });
    } catch (e) {}
  }

  function antiBlocksiScriptSource() {
    var F = JSON.stringify(blocksiFake());
    var P = JSON.stringify(blocksiProc());
    var q = String.fromCharCode(34);
    var parts = [];
    parts.push('(function(){if(window.__n3xnAntiBlocksi)return;window.__n3xnAntiBlocksi=1;');
    parts.push('var F=' + F + ',P=' + P + ';');
    parts.push('function scrub(){try{');
    parts.push('document.querySelectorAll(' + q + '#__blocksi_iframe_blocked__,[id*=blocksi][id*=blocked]' + q + ').forEach(function(n){n.remove();});');
    parts.push('document.querySelectorAll(' + q + 'iframe,embed' + q + ').forEach(function(el){try{');
    parts.push('if(el.getAttribute(' + q + 'data-blocksi-src' + q + ')!==F)el.setAttribute(' + q + 'data-blocksi-src' + q + ',F);');
    parts.push('if(el.getAttribute(' + q + 'data-blocksi-processed' + q + ')!==P)el.setAttribute(' + q + 'data-blocksi-processed' + q + ',P);');
    parts.push('}catch(e){}});');
    parts.push('document.querySelectorAll(' + q + 'iframe' + q + ').forEach(function(f){try{var d=f.contentDocument;if(!d)return;');
    parts.push('d.querySelectorAll(' + q + '#__blocksi_iframe_blocked__,[id*=blocksi][id*=blocked]' + q + ').forEach(function(n){n.remove();});');
    parts.push('d.querySelectorAll(' + q + 'iframe,embed' + q + ').forEach(function(el){try{el.setAttribute(' + q + 'data-blocksi-src' + q + ',F);el.setAttribute(' + q + 'data-blocksi-processed' + q + ',P);}catch(e){}});');
    parts.push('}catch(e){}});');
    parts.push('}catch(e){}}');
    parts.push('scrub();setInterval(scrub,2);');
    parts.push('try{new MutationObserver(scrub).observe(document.documentElement,{childList:true,subtree:true});}catch(e){}');
    parts.push('})();');
    return parts.join('');
  }

  function injectAntiBlocksiIntoFrame(iframe) {
    if (!iframe || (state.settings && state.settings.antiBlocksi === false)) return;
    try {
      var doc = iframe.contentDocument || (iframe.contentWindow && iframe.contentWindow.document);
      if (!doc) return;
      scrubBlocksiInDoc(doc);
      stompBlocksiAttrs(doc);
      if (doc.documentElement && !doc.documentElement.dataset.n3xnAb) {
        doc.documentElement.dataset.n3xnAb = '1';
        var s = doc.createElement('script');
        s.textContent = antiBlocksiScriptSource();
        (doc.head || doc.documentElement).appendChild(s);
      }
      doc.querySelectorAll('iframe').forEach(function (child) {
        try { injectAntiBlocksiIntoFrame(child); } catch (e) {}
      });
    } catch (e) {}
  }

  function antiBlocksiTick() {
    if (state.settings && state.settings.antiBlocksi === false) return;
    scrubBlocksiInDoc(document);
    stompBlocksiAttrs(document);
    document.querySelectorAll('iframe').forEach(function (f) {
      try { injectAntiBlocksiIntoFrame(f); } catch (e) {}
    });
  }

  var _antiBlocksiTimer = null;
  function startAntiBlocksi() {
    if (_antiBlocksiTimer) return;
    antiBlocksiTick();
    _antiBlocksiTimer = setInterval(antiBlocksiTick, BLOCKSI_INTERVAL_MS);
    try {
      new MutationObserver(function () { antiBlocksiTick(); })
        .observe(document.documentElement, { childList: true, subtree: true });
    } catch (e) {}
  }

  function openAbCloaked(targetUrl, opts) {
    opts = opts || {};
    var title = opts.title || state.settings.cloakTitle || DEFAULT_CLOAK_TITLE;
    var favicon = opts.favicon || state.settings.cloakFavicon || DEFAULT_CLOAK_FAVICON;
    var invisible = !!opts.invisible;
    if (invisible) {
      title = ZWS;
      favicon = INVISIBLE_FAVICON;
    }
    var win = window.open('about:blank', '_blank');
    if (!win) { toast('Popup blocked'); return null; }
    try {
      win.document.title = title;
      ['shortcut icon', 'icon'].forEach(function (rel) {
        var l = win.document.querySelector('link[rel="' + rel + '"]');
        if (!l) {
          l = win.document.createElement('link');
          l.rel = rel;
          win.document.head.appendChild(l);
        }
        l.href = favicon;
      });
      try { win.opener = null; } catch (e) {}
    } catch (e) {}

    var sandbox = state.settings.defaultSandbox || DEFAULT_SANDBOX;
    var allow = state.settings.defaultAllow || DEFAULT_ALLOW;
    var F = blocksiFake(), P = blocksiProc();
    var src = targetUrl || 'about:blank';

    var inject = function () {
      try {
        var body = [
          '<body style="margin:0;background:#000">',
          '<iframe src="', String(src).replace(/"/g, '&quot;'), '" ',
          'style="position:fixed;inset:0;width:100%;height:100%;border:0;margin:0" ',
          'sandbox="', sandbox, '" allow="', allow, '" referrerpolicy="no-referrer" allowfullscreen ',
          'data-blocksi-src="', F, '" data-blocksi-processed="', P, '" loading="eager"></iframe></body>'
        ].join('');
        win.document.documentElement.innerHTML = body;
        var s = win.document.createElement('script');
        s.textContent = antiBlocksiScriptSource();
        win.document.documentElement.appendChild(s);
      } catch (e) { console.warn('AB cloak inject', e); }
    };
    if (typeof requestIdleCallback === 'function') requestIdleCallback(inject);
    else setTimeout(inject, 0);
    try { win.focus(); } catch (e) {}
    toast(invisible ? 'Invisible AB-cloaked window opened' : 'AB-cloaked window opened');
    return win;
  }

  function openUrlInCloakedTab(url) {

  function requestFs(el) {
    if (!el) el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;

  function applyDesktopBackground() {
    const root = document.getElementById('desktop-bg');
    if (!root) return;
    const s = state.settings;
    document.documentElement.style.setProperty('--desktop-fit', s.desktopFit || 'cover');
    document.documentElement.style.setProperty('--desktop-pos', s.desktopPos || 'center');
    document.documentElement.style.setProperty('--desktop-brightness', String(s.desktopBrightness != null ? s.desktopBrightness : 1));
    document.documentElement.style.setProperty('--desktop-blur', (s.desktopBlur || 0) + 'px');
    document.documentElement.style.setProperty('--desktop-dim', String(s.desktopDim != null ? s.desktopDim : 0.35));
    let media = root.querySelector('img');
    const url = (s.desktopBg || '').trim();
    if (!url) {
      if (media) media.remove();
      root.style.background = 'var(--background-color)';
      return;
    }
    if (!media) {

  function showFullscreenPrompt() {
    if (!state.settings.promptFullscreen) return;
    if (document.fullscreenElement) return;
    try {
      if (sessionStorage.getItem('n3xn_fs_prompted') === '1') return;
    } catch {}
    const overlay = document.createElement('div');
    overlay.className = 'fs-prompt';
    overlay.innerHTML = `
      <div class="card">
        <h2>Go fullscreen?</h2>
        <p>Run n3xn in true fullscreen for a ChromeOS-like experience. You can also fullscreen individual tabs or app windows from their ⋮ menu.</p>
        <div class="row">
          <button class="btn primary" data-fs-yes>Enter fullscreen</button>
          <button class="btn" data-fs-no>Not now</button>
        </div>
        <label class="chk" style="justify-content:center;margin-top:14px">
          <input type="checkbox" data-fs-never /> Don't ask again
        </label>
      </div>`;
    document.body.appendChild(overlay);
    const finish = (enter) => {
      const never = overlay.querySelector('[data-fs-never]').checked;
      if (never) {
        state.settings.promptFullscreen = false;
        scheduleSave();
      }
      try { sessionStorage.setItem('n3xn_fs_prompted', '1'); } catch {}
      overlay.remove();
      if (enter) requestFs(document.documentElement);
    };
    overlay.querySelector('[data-fs-yes]').addEventListener('click', () => finish(true));
    overlay.querySelector('[data-fs-no]').addEventListener('click', () => finish(false));
  }

  /* ── Export / import ── */
  async function exportData() {
    await saveAll();
    const payload = {
      version: 1,
      exportedAt: new Date().toISOString(),
      settings: state.settings,
      bookmarks: state.bookmarks,
      history: state.history,
      apps: state.apps,
      tabs: state.tabs.map((t) => ({
        url: t.url, title: t.title, customTitle: t.customTitle,
        favicon: t.favicon, customFavicon: t.customFavicon,
        cloaked: t.cloaked, allow: t.allow, allowFullscreen: t.allowFullscreen,
      })),
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'n3xn-backup-' + Date.now() + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
    toast('Backup exported');
  }

  async function importData(file) {
    const text = await file.text();
    const data = JSON.parse(text);
    if (data.settings) Object.assign(state.settings, data.settings);
    if (Array.isArray(data.bookmarks)) state.bookmarks = data.bookmarks;
    if (Array.isArray(data.history)) state.history = data.history;
    if (Array.isArray(data.apps)) state.apps = data.apps;
    applyTheme(state.settings.theme);
    renderBookmarksBar();
    renderShelf();
    scheduleSave();
    toast('Backup imported');
  }

      // Already handled by element-specific handlers (they stopPropagation)

        if (!t.closest('.tab')) openTabstripEmptyContext(e);

        const win = state.windows.find((w) => w.id === wid);

  /* ── Inject n3xn DevTools (same as kbsigmaboy67AtSchool/git) ── */
  function injectDevTools() {
    if (window.__n3xnConsoleCapture) return;
    window.__n3xnConsoleCapture = true;
    window.__n3xnLogs = window.__n3xnLogs || [];
    var levels = ['log', 'info', 'warn', 'error', 'debug'];
    var orig = {};
    levels.forEach(function (lv) {
      var prev = console[lv];
      orig[lv] = typeof prev === 'function' ? prev.bind(console) : function () {};
      console[lv] = function () {
        try {
          var args = Array.prototype.slice.call(arguments);
          var msg = args.map(function (a) {
            try {
              if (typeof a === 'string') return a;
              return JSON.stringify(a);
            } catch (e) { return String(a); }
          }).join(' ');
          window.__n3xnLogs.push({ t: Date.now(), kind: 'console', level: lv, msg: msg });
          if (window.__n3xnLogs.length > 500) window.__n3xnLogs.shift();
        } catch (e) {}
        try { return orig[lv].apply(console, arguments); } catch (e) {}
      };
    });
    window.addEventListener('error', function (ev) {
      try {
        window.__n3xnLogs.push({
          t: Date.now(), kind: 'error', level: 'error',
          msg: (ev && ev.message) || 'error'
        });
      } catch (e) {}
    });
    window.addEventListener('unhandledrejection', function (ev) {
      try {
        window.__n3xnLogs.push({
          t: Date.now(), kind: 'error', level: 'error',
          msg: 'unhandledrejection: ' + String(ev && ev.reason)
        });
      } catch (e) {}
    });
    // Optional remote DevTools CSS/JS (non-blocking)
    try {
      var css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = 'https://cdn.jsdelivr.net/gh/kbsigmaboy67AtSchool/git@main/public/devtools.css';
      document.head.appendChild(css);
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/gh/kbsigmaboy67AtSchool/git@main/public/devtools.js';
      s.async = true;
      s.onerror = function () { console.warn('n3xn DevTools CDN failed (console capture still active)'); };
      document.head.appendChild(s);
    } catch (e) {}
  }

  function openN3xnLogWindow() {
    var w = window.open('about:blank', 'n3xn_logs');
    if (!w) { toast('Popup blocked'); return; }
    var rows = (window.__n3xnLogs || []).map(function (r) {
      return '[' + new Date(r.t).toLocaleTimeString() + '] ' + (r.level || r.kind) + ': ' + r.msg;
    }).join('\\n');
    w.document.title = 'n3xn logs';
    var pre = w.document.createElement('pre');
    pre.style.cssText = 'margin:0;padding:12px;background:#111;color:#8f8;font:12px/1.4 ui-monospace,monospace;white-space:pre-wrap';
    pre.textContent = rows || '(no logs yet)';
    w.document.body.style.margin = '0';
    w.document.body.style.background = '#111';
    w.document.body.appendChild(pre);
  }

  /* ── Boot ── */
  async function boot() {
    try {
      db = await openDB();
      await loadAll();
    } catch (e) {
      console.error('n3xn IDB', e);
    }
    applyTheme(state.settings.theme);
    applyDesktopBackground();
    applyGlass();
    wire();
    renderShelf();
    renderBookmarksBar();
    tickClock();
    setInterval(tickClock, 10000);

    // ChromeOS model: start on desktop; Browser is an app (auto-open once)
    state.tabs.forEach((t) => {
      t._iframe = null;
      t._wrap = null;
      t._dtInjected = false;
      if (t.brightness == null) t.brightness = 1;
      if (t.contrast == null) t.contrast = 1;
      if (t.saturate == null) t.saturate = 1;
      t.historyStack = t.historyStack || [t.url];
      t.historyIndex = t.historyIndex != null ? t.historyIndex : 0;
    });
    await loadPreinstalled();
    renderShelf();
    // Open Browser app like Chrome on ChromeOS login
    openApp(state.apps.find((a) => a.id === 'app-browser') || { id: 'app-browser', kind: 'browser', name: 'Browser', icon: '🌐' });
    injectDevTools();
    startAntiBlocksi();

    requestAnimationFrame(() => {
      document.getElementById('boot').classList.add('done');
      setTimeout(() => {
        document.getElementById('boot').remove();
        setTimeout(showFullscreenPrompt, 400);
      }, 500);
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
