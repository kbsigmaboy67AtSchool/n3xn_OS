@import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Inconsolata:wght@400;600&display=swap');

:root {
  --background-image: none;
  --font-family: 'Ubuntu', system-ui, -apple-system, sans-serif;
  --text-color: #fff;
  --background-color: #0a0a0c;
  --border-color1: #000000;
  --border-color2: #3c4043;
  --hover-color: #1a1818;
  --text-glow: #000000;
  --shelf-h: 48px;
  --tab-h: 36px;
  --accent: #8ab4f8;
  --shelf-bg: rgba(18, 18, 22, 0.92);
  --surface: #16161a;
  --surface2: #1e1e24;
  --danger: #f28b82;
  --success: #81c995;
  --muted: #9aa0a6;
  --radius: 12px;
  --shadow: 0 8px 32px rgba(0,0,0,.45);
  --glass-blur: 16px;
  --glass-opacity: 0.72;
  --desktop-fit: cover;
  --desktop-pos: center;
  --desktop-brightness: 1;
  --desktop-blur: 0px;
  --desktop-dim: 0.35;
}

html.glass-on #tabstrip,
html.glass-on #toolbar,
html.glass-on #bookmarks-bar,
html.glass-on #shelf,
html.glass-on .app-window .win-titlebar,
html.glass-on .modal,
html.glass-on .ctx-menu,
html.glass-on .launcher-panel,
html.glass-on .tab.active {
  backdrop-filter: blur(var(--glass-blur)) saturate(1.35);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.35);
}

html.glass-on #tabstrip {
  background: color-mix(in srgb, var(--surface) calc(var(--glass-opacity) * 100%), transparent);
}
html.glass-on #toolbar,
html.glass-on #bookmarks-bar {
  background: color-mix(in srgb, var(--surface2) calc(var(--glass-opacity) * 100%), transparent);
}
html.glass-on #shelf {
  background: color-mix(in srgb, var(--shelf-bg) calc(var(--glass-opacity) * 100%), transparent);
}
html.glass-on .app-window {
  background: color-mix(in srgb, var(--surface) calc(var(--glass-opacity) * 100%), transparent);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
}
html.glass-on .modal,
html.glass-on .ctx-menu,
html.glass-on .launcher-panel {
  background: color-mix(in srgb, var(--surface) calc(var(--glass-opacity) * 100%), transparent);
}

#desktop-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
  background: var(--background-color);
}
#desktop-bg img,
#desktop-bg video {
  width: 100%;
  height: 100%;
  object-fit: var(--desktop-fit);
  object-position: var(--desktop-pos);
  filter: brightness(var(--desktop-brightness)) blur(var(--desktop-blur));
  transform: scale(1.02);
}
#desktop-bg .dim {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, var(--desktop-dim));
}
#os {
  position: relative;
  z-index: 1;
}

.chrome-menu-btn {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--muted);
  font-size: 16px;
  line-height: 1;
  letter-spacing: 1px;
  flex-shrink: 0;
  transition: background .12s, color .12s;
}
.chrome-menu-btn:hover {
  background: var(--hover-color);
  color: var(--text-color);
}
.tab .chrome-menu-btn {
  width: 18px;
  height: 18px;
  font-size: 12px;
  opacity: 0;
}
.tab:hover .chrome-menu-btn,
.tab.active .chrome-menu-btn { opacity: 0.85; }

.frame-wrap iframe,
.app-window .win-body iframe {
  filter: brightness(var(--surface-brightness, 1)) contrast(var(--surface-contrast, 1)) saturate(var(--surface-saturate, 1));
}

.fs-prompt {
  position: fixed;
  inset: 0;
  z-index: 1000000;
  background: rgba(0,0,0,.65);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.fs-prompt .card {
  background: var(--surface);
  border: 1px solid var(--border-color2);
  border-radius: 16px;
  padding: 24px;
  max-width: 400px;
  text-align: center;
  box-shadow: var(--shadow);
}
.fs-prompt h2 { margin-bottom: 8px; font-size: 18px; }
.fs-prompt p { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
.fs-prompt .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

  --text-color: rgb(228, 215, 171);

  --text-glow: rgb(110, 84, 13);

  --text-color: rgb(237, 234, 223);

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  width: 100%;
  overflow: hidden;
  font-family: var(--font-family);
  background: var(--background-color);
  color: var(--text-color);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font-family: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
a { color: var(--accent); }

/* ── Shell (ChromeOS desktop — browser is an app, not the shell) ── */
#os {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  width: 100%;
  position: relative;
  z-index: 1;
  background: transparent;
  pointer-events: none;
}
#os #shelf { pointer-events: auto; }
#desktop {
  flex: 1;
  min-height: 0;
  position: relative;
  pointer-events: auto;
}

/* Tab strip (Chrome-like) */
#tabstrip {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  height: var(--tab-h);
  min-height: var(--tab-h);
  padding: 4px 8px 0 8px;
  background: var(--surface);
  border-bottom: 1px solid var(--border-color2);
  overflow-x: auto;
  overflow-y: hidden;
  flex-shrink: 0;
  scrollbar-width: none;
}
#tabstrip::-webkit-scrollbar { display: none; }

.tab {
  display: flex;
  align-items: center;
  gap: 6px;
  max-width: 200px;
  min-width: 80px;
  height: 28px;
  padding: 0 8px 0 10px;
  border-radius: 8px 8px 0 0;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
  user-select: none;
  position: relative;
  transition: background .12s, color .12s;
}
.tab:hover { background: var(--hover-color); color: var(--text-color); }
.tab.active {
  background: var(--surface2);
  color: var(--text-color);
  box-shadow: inset 0 1px 0 var(--border-color2);
}
.tab .fav {
  width: 14px; height: 14px;
  border-radius: 2px;
  flex-shrink: 0;
  object-fit: contain;
  background: transparent;
}
.tab .title {
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}
.tab .close {
  width: 16px; height: 16px;
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 11px;
  opacity: 0.5;
  flex-shrink: 0;
}
.tab .close:hover { opacity: 1; background: rgba(255,255,255,.12); }
#new-tab-btn {
  width: 28px; height: 28px;
  border-radius: 6px;
  display: grid; place-items: center;
  color: var(--muted);
  font-size: 18px;
  margin-left: 4px;
  flex-shrink: 0;
}
#new-tab-btn:hover { background: var(--hover-color); color: var(--text-color); }

/* Omnibox / toolbar */
#toolbar {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 40px;
  padding: 0 10px;
  background: var(--surface2);
  border-bottom: 1px solid var(--border-color2);
  flex-shrink: 0;
}
.tb-btn {
  width: 32px; height: 32px;
  border-radius: 50%;
  display: grid; place-items: center;
  color: var(--muted);
  font-size: 16px;
  transition: background .12s, color .12s;
}
.tb-btn:hover:not(:disabled) { background: var(--hover-color); color: var(--text-color); }
.tb-btn:disabled { opacity: .35; cursor: default; }
#omnibox-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  height: 30px;
  background: var(--background-color);
  border: 1px solid var(--border-color2);
  border-radius: 16px;
  padding: 0 12px;
  gap: 8px;
  transition: border-color .15s, box-shadow .15s;
}
#omnibox-wrap:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent);
}
#omnibox {
  flex: 1;
  border: none;
  outline: none;
  background: transparent;
  color: var(--text-color);
  font-size: 13px;
  min-width: 0;
}
#omnibox::placeholder { color: var(--muted); }
.omni-icon { color: var(--muted); font-size: 14px; flex-shrink: 0; }

/* Content area — tabs keep iframes alive (display:none, not remove) */
#content {
  flex: 1;
  position: relative;
  overflow: hidden;
  background: transparent;
  min-height: 0;
}
.frame-wrap {
  position: absolute;
  inset: 0;
  display: none;
  background: color-mix(in srgb, var(--background-color) 88%, transparent);
}
html.glass-on .frame-wrap {
  background: color-mix(in srgb, var(--background-color) 55%, transparent);
}
html.glass-on .home-page {
  background: transparent;
}
.frame-wrap.active { display: block; }
.frame-wrap iframe {
  width: 100%;
  height: 100%;
  border: 0;
  background: #fff;
}
.frame-wrap .frame-loading {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: var(--background-color);
  color: var(--muted);
  font-size: 14px;
  pointer-events: none;
  opacity: 0;
  transition: opacity .2s;
}
.frame-wrap.loading .frame-loading { opacity: 1; }

/* New-tab / home page inside content */
.home-page {
  position: absolute;
  inset: 0;
  overflow: auto;
  background: var(--background-color);
  color: var(--text-color);
  padding: 24px 32px 80px;
}
.home-page h1 {
  font-size: 42px;
  text-align: center;
  margin: 24px 0 8px;
  text-shadow: 0 0 20px var(--text-glow), 0 0 40px var(--text-glow);
}
.home-page .sub {
  text-align: center;
  color: var(--muted);
  margin-bottom: 28px;
  font-size: 14px;
}
.search-big {
  max-width: 560px;
  margin: 0 auto 36px;
  display: flex;
  height: 44px;
  background: var(--surface);
  border: 2px solid var(--border-color2);
  border-radius: 22px;
  overflow: hidden;
  transition: border-color .15s;
}
.search-big:focus-within { border-color: var(--accent); }
.search-big input {
  flex: 1;
  border: none;
  outline: none;
  background: transparent;
  padding: 0 18px;
  font-size: 15px;
  color: var(--text-color);
}
.search-big button {
  padding: 0 20px;
  background: var(--hover-color);
  color: var(--text-color);
  font-weight: 500;
  border-left: 1px solid var(--border-color2);
}
.search-big button:hover { background: color-mix(in srgb, var(--accent) 30%, var(--hover-color)); }

.section-title {
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--muted);
  margin: 20px 0 12px;
  font-weight: 600;
}
.apps-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
  gap: 12px;
  max-width: 900px;
  margin: 0 auto;
}
.app-tile {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 14px 8px;
  border-radius: var(--radius);
  border: 1px solid transparent;
  transition: background .12s, border-color .12s, transform .12s;
  cursor: pointer;
  user-select: none;
}
.app-tile:hover {
  background: var(--hover-color);
  border-color: var(--border-color2);
  transform: translateY(-2px);
}
.app-tile .icon {
  width: 48px; height: 48px;
  border-radius: 12px;
  display: grid; place-items: center;
  font-size: 24px;
  background: var(--surface2);
  border: 1px solid var(--border-color2);
  overflow: hidden;
}
.app-tile .icon img { width: 100%; height: 100%; object-fit: cover; }
.app-tile .name {
  font-size: 12px;
  text-align: center;
  max-width: 88px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ChromeOS-style shelf */
#shelf {
  height: var(--shelf-h);
  min-height: var(--shelf-h);
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 12px;
  background: var(--shelf-bg);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--border-color2);
  flex-shrink: 0;
  z-index: 100;
}
.shelf-btn {
  width: 40px; height: 40px;
  border-radius: 10px;
  display: grid; place-items: center;
  color: var(--text-color);
  font-size: 18px;
  transition: background .12s;
  position: relative;
}
.shelf-btn:hover { background: var(--hover-color); }
.shelf-btn.active::after {
  content: '';
  position: absolute;
  bottom: 2px;
  left: 50%;
  transform: translateX(-50%);
  width: 6px; height: 3px;
  border-radius: 2px;
  background: var(--accent);
}
#shelf-clock {
  margin-left: auto;
  font-size: 12px;
  color: var(--muted);
  padding: 0 10px;
  font-variant-numeric: tabular-nums;
  text-align: right;
  line-height: 1.3;
}
#shelf-apps {
  display: flex;
  gap: 2px;
  overflow-x: auto;
  max-width: 50vw;
  scrollbar-width: none;
}
#shelf-apps::-webkit-scrollbar { display: none; }

/* Context menus */
.ctx-menu {
  position: fixed;
  z-index: 100000;
  min-width: 180px;
  background: var(--surface2);
  border: 1px solid var(--border-color2);
  border-radius: 10px;
  box-shadow: var(--shadow);
  padding: 6px;
  display: none;
  font-size: 13px;
}
.ctx-menu.open { display: block; }
.ctx-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: 6px;
  color: var(--text-color);
  cursor: pointer;
  user-select: none;
}
.ctx-item:hover { background: var(--hover-color); }
.ctx-item.danger { color: var(--danger); }
.ctx-sep { height: 1px; background: var(--border-color2); margin: 4px 6px; }

/* Modals / panels */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  z-index: 50000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-backdrop.open { display: flex; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border-color2);
  border-radius: 16px;
  box-shadow: var(--shadow);
  width: min(520px, 100%);
  max-height: min(80vh, 640px);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.modal.wide { width: min(720px, 100%); }
.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border-color2);
  font-weight: 600;
  font-size: 15px;
}
.modal-body {
  padding: 16px 18px;
  overflow: auto;
  flex: 1;
}
.modal-foot {
  padding: 12px 18px;
  border-top: 1px solid var(--border-color2);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}
.btn {
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  border: 1px solid var(--border-color2);
  background: var(--surface2);
  color: var(--text-color);
  transition: background .12s;
}
.btn:hover { background: var(--hover-color); }
.btn.primary {
  background: color-mix(in srgb, var(--accent) 25%, var(--surface2));
  border-color: var(--accent);
  color: var(--text-color);
}
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--border-color2)); }
.field {
  margin-bottom: 14px;
}
.field label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 5px;
}
.field input, .field select, .field textarea {
  width: 100%;
  padding: 9px 12px;
  border-radius: 8px;
  border: 1px solid var(--border-color2);
  background: var(--background-color);
  color: var(--text-color);
  font-size: 13px;
  outline: none;
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--accent);
}
.field textarea { min-height: 80px; resize: vertical; }
.chk {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  margin: 8px 0;
  cursor: pointer;
}
.chk input { width: 16px; height: 16px; accent-color: var(--accent); }

/* Launcher (app drawer) */
#launcher {
  position: fixed;
  inset: 0;
  z-index: 40000;
  background: rgba(0,0,0,.5);
  backdrop-filter: blur(8px);
  display: none;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: calc(var(--shelf-h) + 12px);
}
#launcher.open { display: flex; }
.launcher-panel {
  width: min(720px, 94vw);
  max-height: 70vh;
  background: var(--shelf-bg);
  border: 1px solid var(--border-color2);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 20px;
  overflow: auto;
}
.launcher-search {
  width: 100%;
  height: 40px;
  border-radius: 12px;
  border: 1px solid var(--border-color2);
  background: var(--background-color);
  padding: 0 14px;
  margin-bottom: 16px;
  font-size: 14px;
  outline: none;
  color: var(--text-color);
}
.launcher-search:focus { border-color: var(--accent); }

/* Settings */
.settings-grid {
  display: grid;
  gap: 16px;
}
.theme-swatches {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.swatch {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
}
.swatch.active { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 40%, transparent); }

/* Toast */
#toasts {
  position: fixed;
  bottom: calc(var(--shelf-h) + 16px);
  right: 16px;
  z-index: 90000;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
.toast {
  background: var(--surface2);
  border: 1px solid var(--border-color2);
  border-radius: 10px;
  padding: 10px 16px;
  font-size: 13px;
  box-shadow: var(--shadow);
  animation: toastIn .25s ease;
  max-width: 320px;
}
@keyframes toastIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

/* Bookmarks bar (optional) */
#bookmarks-bar {
  display: none;
  align-items: center;
  gap: 4px;
  height: 28px;
  padding: 0 10px;
  background: var(--surface);
  border-bottom: 1px solid var(--border-color2);
  overflow-x: auto;
  flex-shrink: 0;
  font-size: 12px;
}
#bookmarks-bar.visible { display: flex; }
.bm-chip {
  padding: 3px 10px;
  border-radius: 12px;
  white-space: nowrap;
  color: var(--muted);
  cursor: pointer;
}
.bm-chip:hover { background: var(--hover-color); color: var(--text-color); }

/* Windowed apps (independent of browser tabs) */
#app-windows {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 20000;
}
.app-window {
  position: absolute;
  pointer-events: auto;
  background: var(--surface);
  border: 1px solid var(--border-color2);
  border-radius: 12px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 280px;
  min-height: 180px;
}
.app-window .win-titlebar {
  height: 36px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  background: var(--surface2);
  border-bottom: 1px solid var(--border-color2);
  cursor: move;
  user-select: none;
  flex-shrink: 0;
}
.app-window .win-titlebar .win-icon { width: 16px; height: 16px; border-radius: 3px; }
.app-window .win-titlebar .win-name { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.app-window .win-ctrls { display: flex; gap: 4px; }
.app-window .win-ctrls button {
  width: 24px; height: 24px;
  border-radius: 6px;
  display: grid; place-items: center;
  font-size: 12px;
  color: var(--muted);
}
.app-window .win-ctrls button:hover { background: var(--hover-color); color: var(--text-color); }
.app-window .win-ctrls .win-close:hover { background: var(--danger); color: #fff; }
.app-window .win-body {
  flex: 1;
  min-height: 0;
  position: relative;
  background: #111;
  display: flex;
  flex-direction: column;
}
.app-window .win-body iframe {
  width: 100%; height: 100%; border: 0; flex: 1;
}
.app-window .win-body .home-page {
  flex: 1;
  overflow: auto;
}
/* Full Chrome-like browser chrome inside the Browser app window */
.browser-chrome {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
  background: var(--surface);
}
.browser-chrome .bw-tabstrip {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  height: var(--tab-h);
  min-height: var(--tab-h);
  padding: 4px 8px 0 8px;
  background: var(--surface);
  border-bottom: 1px solid var(--border-color2);
  overflow-x: auto;
  scrollbar-width: none;
}
.browser-chrome .bw-tabstrip::-webkit-scrollbar { display: none; }
.browser-chrome .bw-toolbar {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 40px;
  padding: 0 10px;
  background: var(--surface2);
  border-bottom: 1px solid var(--border-color2);
  flex-shrink: 0;
}
.browser-chrome .bw-omni-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  height: 30px;
  background: var(--background-color);
  border: 1px solid var(--border-color2);
  border-radius: 16px;
  padding: 0 12px;
  gap: 8px;
  min-width: 0;
}
.browser-chrome .bw-omni-wrap:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent);
}
.browser-chrome .bw-omni {
  flex: 1;
  border: none;
  outline: none;
  background: transparent;
  color: var(--text-color);
  font-size: 13px;
  min-width: 0;
}
.browser-chrome .bw-content {
  flex: 1;
  min-height: 0;
  position: relative;
  background: color-mix(in srgb, var(--background-color) 88%, transparent);
  overflow: hidden;
}
.browser-chrome .bw-bookmarks {
  display: none;
  align-items: center;
  gap: 4px;
  height: 28px;
  padding: 0 10px;
  background: var(--surface);
  border-bottom: 1px solid var(--border-color2);
  overflow-x: auto;
  font-size: 12px;
}
.browser-chrome .bw-bookmarks.visible { display: flex; }
html.glass-on .browser-chrome .bw-tabstrip,
html.glass-on .browser-chrome .bw-toolbar,
html.glass-on .browser-chrome .bw-bookmarks {
  backdrop-filter: blur(var(--glass-blur)) saturate(1.35);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.35);
  background: color-mix(in srgb, var(--surface) calc(var(--glass-opacity) * 100%), transparent);
}
.app-window.browser-app {
  min-width: 480px;
  min-height: 320px;
}
.app-window.browser-app .win-body {
  background: transparent;
  overflow: hidden;
}
.app-window.browser-app.maximized {
  /* leave room for shelf like ChromeOS maximized windows */
  bottom: var(--shelf-h) !important;
  height: auto !important;
}
.app-window.maximized {
  inset: 0 !important;
  width: auto !important;
  height: auto !important;
  border-radius: 0;
}
.app-window.minimized { display: none; }
.resize-handle {
  position: absolute;
  right: 0; bottom: 0;
  width: 14px; height: 14px;
  cursor: nwse-resize;
  background: linear-gradient(135deg, transparent 50%, var(--border-color2) 50%);
}

/* Boot splash */
#boot {
  position: fixed;
  inset: 0;
  z-index: 999999;
  background: #0a0a0c;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  transition: opacity .4s;
}
#boot.done { opacity: 0; pointer-events: none; }
#boot .logo {
  font-size: 48px;
  font-weight: 700;
  letter-spacing: -1px;
  color: #8ab4f8;
  text-shadow: 0 0 30px rgba(138,180,248,.4);
}
#boot .spin {
  width: 28px; height: 28px;
  border: 3px solid #3c4043;
  border-top-color: #8ab4f8;
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Utility */
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
</style>
</head>

  function mergeBuiltinApps(existing) {
    const byId = new Map((existing || []).map((a) => [a.id, a]));
    BUILTIN_APPS.forEach((b) => {
      if (!byId.has(b.id)) {
        byId.set(b.id, { ...b });
        return;
      }
      const cur = byId.get(b.id);
      if (b.system) {
        cur.system = true;
        cur.name = b.name;
        cur.url = b.url;
        cur.icon = b.icon;
        if (b.kind) cur.kind = b.kind;
      } else {
        if (!cur.icon) cur.icon = b.icon;
        if (!cur.url) cur.url = b.url;
        if (!cur.name) cur.name = b.name;
      }
    });
    return Array.from(byId.values());
  }

  /* ── IndexedDB ── */
  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = (e) => {
        const d = e.target.result;
        STORES.forEach((s) => {
          if (!d.objectStoreNames.contains(s)) d.createObjectStore(s);
        });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  function idbGet(store, key) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(store, 'readonly');
      const r = tx.objectStore(store).get(key);
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    });
  }

  function idbSet(store, key, value) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(store, 'readwrite');
      tx.objectStore(store).put(value, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  function idbClear(store) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(store, 'readwrite');
      tx.objectStore(store).clear();
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function saveAll() {
    if (!db) return;
    try {
      const tabsPersist = state.tabs.map((t) => ({
        id: t.id,
        url: t.url,
        title: t.title,
        customTitle: t.customTitle,
        favicon: t.favicon,
        customFavicon: t.customFavicon,
        cloaked: t.cloaked,
        allow: t.allow,
        allowFullscreen: t.allowFullscreen,
        brightness: t.brightness,
        contrast: t.contrast,
        saturate: t.saturate,
        glass: t.glass,
        isHome: t.isHome,
      }));
      await Promise.all([
        idbSet('tabs', 'list', tabsPersist),
        idbSet('tabs', 'active', state.activeTabId),
        idbSet('bookmarks', 'list', state.bookmarks),
        idbSet('history', 'list', state.history.slice(0, 500)),
        idbSet('apps', 'list', state.apps),
        idbSet('settings', 'main', state.settings),
        idbSet('meta', 'seq', { tabIdSeq, winIdSeq }),
      ]);
    } catch (e) {
      console.warn('n3xn save', e);
    }
  }

  let saveTimer = null;
  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveAll, 250);
  }

  async function loadAll() {
    const [tabsList, active, bms, hist, apps, settings, seq] = await Promise.all([
      idbGet('tabs', 'list'),
      idbGet('tabs', 'active'),
      idbGet('bookmarks', 'list'),
      idbGet('history', 'list'),
      idbGet('apps', 'list'),
      idbGet('settings', 'main'),
      idbGet('meta', 'seq'),
    ]);
    if (settings) Object.assign(state.settings, settings);
    if (Array.isArray(bms)) state.bookmarks = bms;
    if (Array.isArray(hist)) state.history = hist;
    if (seq) {
      tabIdSeq = seq.tabIdSeq || 1;
      winIdSeq = seq.winIdSeq || 1;
    }
    if (Array.isArray(apps) && apps.length) {
      state.apps = mergeBuiltinApps(apps);
    } else {
      state.apps = BUILTIN_APPS.map((a) => ({ ...a }));
    }
    if (Array.isArray(tabsList) && tabsList.length) {
      state.tabs = tabsList;
      state.activeTabId = active || tabsList[0].id;
    }
  }

  /* Try external preinstalled.json */
  async function loadPreinstalled() {
    try {
      const r = await fetch('/preinstalled.json', { cache: 'no-store' });
      if (!r.ok) return;
      const data = await r.json();
      const list = Array.isArray(data) ? data : (data.apps || data.preinstalled || []);
      if (!list.length) return;
      const existing = new Set(state.apps.map((a) => a.id || a.url));
      for (const item of list) {
        const app = {
          id: item.id || ('app-' + Math.random().toString(36).slice(2, 9)),
          name: item.name || item.title || 'App',
          url: item.url || item.href || 'about:blank',
          icon: item.icon || item.favicon || '📦',
          shelf: !!item.shelf,
          system: !!item.system,
          cloak: !!item.cloak,
        };
        if (!existing.has(app.id) && !existing.has(app.url)) {
          state.apps.push(app);
          existing.add(app.id);
        }
      }
      scheduleSave();
    } catch {}
  }

  /* ── Utils ── */
  function uid(prefix = 't') {
    return prefix + (Date.now().toString(36) + Math.random().toString(36).slice(2, 7));
  }

  function toast(msg, ms = 2800) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.getElementById('toasts').appendChild(el);
    setTimeout(() => el.remove(), ms);
  }

  function isAbout(url) {
    return typeof url === 'string' && url.startsWith('about:');
  }

  function normalizeUrl(input) {
    const s = (input || '').trim();
    if (!s) return 'about:home';
    if (isAbout(s)) return s;
    if (/^https?:\/\//i.test(s)) return s;
    if (/^\/\//.test(s)) return 'https:' + s;
    if (/^[a-z0-9.-]+\.[a-z]{2,}([/:].*)?$/i.test(s) || /^localhost(:\d+)?/i.test(s)) {
      return 'https://' + s;
    }
    const eng = state.settings.searchEngine || 'https://duckduckgo.com/?q=%s';
    return eng.replace('%s', encodeURIComponent(s));
  }

  function faviconFor(url) {
    if (!url || isAbout(url)) return DEFAULT_FAVICON;
    try {
      const u = new URL(url);
      return `https://www.google.com/s2/favicons?domain=${encodeURIComponent(u.hostname)}&sz=32`;
    } catch {
      return DEFAULT_FAVICON;
    }
  }

  function displayTitle(tab) {
    if (tab.invisible) return ZWS;
    if (tab.customTitle) return tab.customTitle;
    if (tab.title) return tab.title;
    if (tab.isHome || tab.url === 'about:home') return 'New Tab';
    try { return new URL(tab.url).hostname; } catch { return tab.url || 'Tab'; }
  }

  function displayFavicon(tab) {
    if (tab.invisible) return INVISIBLE_FAVICON;
    return tab.customFavicon || tab.favicon || faviconFor(tab.url);
  }

  /* ── Tab model (tabs live inside Browser app windows) ── */
  function createTab(opts = {}) {
    let win = getFocusedBrowser();
    if (!win) {
      openApp(state.apps.find((a) => a.id === 'app-browser') || { id: 'app-browser', kind: 'browser', name: 'Browser', icon: '🌐' });
      win = getFocusedBrowser();
    }
    if (!win) return null;
    const tab = createTabForWin(win, opts);
    win.activeTabId = tab.id;
    state.tabs = win.tabs;
    state.activeTabId = tab.id;
    if (win._el) renderBrowserUI(win, win._el);
    scheduleSave();
    return tab;
  }

  function getTab(id) {
    for (const w of state.windows) {
      if (w.kind === 'browser') {
        const t = (w.tabs || []).find((x) => x.id === id);
        if (t) return t;
      }
    }
    return state.tabs.find((t) => t.id === id);
  }

  function getActiveTab() {
    const win = getFocusedBrowser();
    if (win) return win.tabs.find((t) => t.id === win.activeTabId) || win.tabs[0] || null;
    return getTab(state.activeTabId);
  }

  /* ── Render tabs ── */
  function renderTabstrip() {
    // Tabs live inside Browser app windows only (ChromeOS model)
    const win = getFocusedBrowser();
    if (win && win._el) renderBrowserUI(win, win._el);
  }

  function applySurfaceFilter(el, surface) {
    if (!el) return;
    const b = surface.brightness != null ? surface.brightness : 1;
    const c = surface.contrast != null ? surface.contrast : 1;
    const s = surface.saturate != null ? surface.saturate : 1;
    el.style.setProperty('--surface-brightness', String(b));
    el.style.setProperty('--surface-contrast', String(c));
    el.style.setProperty('--surface-saturate', String(s));
  }

  function ensureFrame(tab) {
    // Legacy path: attach to focused browser content host
    const win = getFocusedBrowser() || state.windows.find((w) => w.kind === 'browser');
    if (!win || !win._el) return null;
    return ensureFrameInWin(win, tab, win._el);
  }

  function ensureFrameInWin(win, tab, winEl) {
    const content = winEl.querySelector('.bw-content');
    if (!content) return null;
    if (tab._wrap && tab._wrap.parentNode === content) return tab._wrap;
    if (tab._wrap) tab._wrap.remove();

    const wrap = document.createElement('div');
    wrap.className = 'frame-wrap';
    wrap.dataset.id = tab.id;
    const loading = document.createElement('div');
    loading.className = 'frame-loading';
    loading.textContent = 'Loading…';
    wrap.appendChild(loading);

    if (tab.isHome || tab.url === 'about:home') {
      wrap.appendChild(buildHomePage(tab, win));
    } else if (isAbout(tab.url)) {
      wrap.appendChild(buildAboutPage(tab));
    } else {
      const iframe = document.createElement('iframe');
      iframe.setAttribute('allow', tab.allow || state.settings.defaultAllow || DEFAULT_ALLOW);
      iframe.setAttribute('sandbox', state.settings.defaultSandbox || DEFAULT_SANDBOX);
      if (tab.allowFullscreen !== false && (tab.allowFullscreen || state.settings.allowFullscreen)) {
        iframe.setAttribute('allowfullscreen', '');
      }
      iframe.setAttribute('referrerpolicy', 'no-referrer');
      iframe.loading = 'eager';
      const fakeSrc = state.settings.blocksiFakeSrc || BLOCKSI_FAKE_SRC;
      const fakeProc = state.settings.blocksiProcessed || BLOCKSI_PROC;
      iframe.setAttribute('data-blocksi-src', fakeSrc);
      iframe.setAttribute('data-blocksi-processed', fakeProc);
      iframe.src = tab.url;
      wrap.classList.add('loading');
      iframe.addEventListener('load', () => {
        wrap.classList.remove('loading');
        tryUpdateTabMeta(tab, iframe);
        tryInjectDevtoolsIntoFrame(iframe, tab);
        injectAntiBlocksiIntoFrame(iframe); // immediate inside frame document
        if (win._el) renderBrowserUI(win, win._el);
      });
      iframe.addEventListener('error', () => wrap.classList.remove('loading'));
      tab._iframe = iframe;
      wrap.appendChild(iframe);
    }
    applySurfaceFilter(wrap, tab);
    tab._wrap = wrap;
    content.appendChild(wrap);
    return wrap;
  }

  function renderBrowserUI(win, el) {
    if (!el || win.kind !== 'browser') return;
    win._el = el;
    // Sync global tab pointers for legacy helpers
    state.tabs = win.tabs;
    state.activeTabId = win.activeTabId;
    state.focusedBrowserId = win.id;

    const strip = el.querySelector('.bw-tabstrip');
    const content = el.querySelector('.bw-content');
    const omni = el.querySelector('.bw-omni');
    const lock = el.querySelector('.bw-lock');
    if (!strip || !content) return;

    // Tabs
    strip.querySelectorAll('.tab').forEach((n) => n.remove());
    const newBtn = el.querySelector('.bw-new-tab');
    win.tabs.forEach((tab) => {
      const tEl = document.createElement('div');
      tEl.className = 'tab' + (tab.id === win.activeTabId ? ' active' : '');
      tEl.dataset.id = tab.id;
      tEl.title = isUrlHidden(tab) || isUrlHidden(win) ? 'about:blank' : tab.url;
      const fav = document.createElement('img');
      fav.className = 'fav';
      fav.src = displayFavicon(tab);
      fav.alt = '';
      fav.onerror = () => { fav.src = DEFAULT_FAVICON; };
      const title = document.createElement('span');
      title.className = 'title';
      title.textContent = displayTitle(tab);
      const menuBtn = document.createElement('button');
      menuBtn.className = 'chrome-menu-btn';
      menuBtn.textContent = '⋮';
      menuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        openSurfaceMenu(e, { type: 'tab', tab });
      });
      const close = document.createElement('button');
      close.className = 'close';
      close.textContent = '×';
      close.addEventListener('click', (e) => {
        e.stopPropagation();
        closeTabInWin(win, tab.id);
      });
      tEl.append(fav, title, menuBtn, close);
      tEl.addEventListener('click', () => activateTabInWin(win, tab.id));
      tEl.addEventListener('contextmenu', (e) => openTabContext(e, tab));
      strip.insertBefore(tEl, newBtn);
    });

    // Frames: keep alive, only show active
    content.querySelectorAll('.frame-wrap').forEach((w) => w.classList.remove('active'));
    const active = win.tabs.find((t) => t.id === win.activeTabId) || win.tabs[0];
    if (active) {
      win.activeTabId = active.id;
      const wrap = ensureFrameInWin(win, active, el);
      if (wrap) wrap.classList.add('active');
      if (omni) {
        if (isUrlHidden(active) || isUrlHidden(win)) {
          omni.value = 'about:blank';
          if (lock) lock.textContent = '👁';
        } else if (active.isHome || active.url === 'about:home') {
          omni.value = '';
          if (lock) lock.textContent = '🏠';
        } else {
          omni.value = active.url;
          if (lock) lock.textContent = active.url.startsWith('https') ? '🔒' : '🌐';
        }
      }
      const back = el.querySelector('.bw-back');
      const fwd = el.querySelector('.bw-fwd');
      if (back) back.disabled = active.historyIndex <= 0;
      if (fwd) fwd.disabled = active.historyIndex >= (active.historyStack?.length || 0) - 1;
    }

    const nameEl = el.querySelector('.win-name');
    if (nameEl) {
      if (isUrlHidden(win) || (active && isUrlHidden(active))) nameEl.textContent = 'Browser';
      else if (active) nameEl.textContent = 'Browser — ' + displayTitle(active);
      else nameEl.textContent = 'Browser';
    }
    fillBookmarksBar(el.querySelector('.bw-bookmarks'), win);
    applySurfaceFilter(el, win);
  }

  function activateTabInWin(win, id) {
    if (!win.tabs.some((t) => t.id === id)) return;
    win.activeTabId = id;
    focusBrowser(win);
    if (win._el) renderBrowserUI(win, win._el);
    scheduleSave();
  }

  function closeTabInWin(win, id) {
    const idx = win.tabs.findIndex((t) => t.id === id);
    if (idx < 0) return;
    const tab = win.tabs[idx];
    if (tab._wrap) { tab._wrap.remove(); tab._wrap = null; tab._iframe = null; }
    win.tabs.splice(idx, 1);
    if (!win.tabs.length) {
      const t = createTabForWin(win, { url: 'about:home' });
      win.activeTabId = t.id;
    } else if (win.activeTabId === id) {
      win.activeTabId = win.tabs[Math.min(idx, win.tabs.length - 1)].id;
    }
    if (win._el) renderBrowserUI(win, win._el);
    scheduleSave();
  }

  function tryInjectDevtoolsIntoFrame(iframe, surface) {
    if (!state.settings.injectDevtoolsIntoFrames) return;
    if (surface && surface._dtInjected) return;
    try {
      const doc = iframe.contentDocument;
      const win = iframe.contentWindow;
      if (!doc || !win) return;
      // same-origin only (typical when OS is behind an unblocker/proxy)
      if (doc.getElementById('n3xn-dt-injected')) return;
      const mark = doc.createElement('meta');
      mark.id = 'n3xn-dt-injected';
      (doc.head || doc.documentElement).appendChild(mark);
      const css = doc.createElement('link');
      css.rel = 'stylesheet';
      css.href = 'https://cdn.jsdelivr.net/gh/kbsigmaboy67AtSchool/git@main/public/devtools.css';
      (doc.head || doc.documentElement).appendChild(css);
      const s = doc.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/gh/kbsigmaboy67AtSchool/git@main/public/devtools.js';
      s.async = true;
      (doc.head || doc.documentElement).appendChild(s);
      if (surface) surface._dtInjected = true;
    } catch {
      // cross-origin — expected outside unblocker
    }
  }

  function tryUpdateTabMeta(tab, iframe) {
    // Cross-origin: limited. Poll title/favicon via document when same-origin.
    try {
      const doc = iframe.contentDocument;
      if (doc) {
        const t = doc.title;
        if (t && !tab.customTitle) {
          tab.title = t;
          renderTabstrip();
          updateOmnibox();
        }
        const link = doc.querySelector('link[rel*="icon"]');
        if (link && link.href && !tab.customFavicon) {
          tab.favicon = link.href;
          renderTabstrip();
        }
      }
    } catch {
      // cross-origin — keep URL-based favicon/title
      if (!tab.title) {
        try { tab.title = new URL(tab.url).hostname; } catch {}
        renderTabstrip();
      }
    }
    addHistory(tab.url, displayTitle(tab));
    scheduleSave();
  }

  // Continuously refresh tab chrome for active iframe when possible
  setInterval(() => {
    const tab = getActiveTab();
    if (!tab || !tab._iframe) return;
    tryUpdateTabMeta(tab, tab._iframe);
  }, 2000);

  function activateTab(id) {
    const win = getFocusedBrowser() || state.windows.find((w) => w.kind === 'browser' && (w.tabs || []).some((t) => t.id === id));
    if (win) activateTabInWin(win, id);
  }

  function closeTab(id) {
    const win = state.windows.find((w) => w.kind === 'browser' && (w.tabs || []).some((t) => t.id === id)) || getFocusedBrowser();
    if (win) closeTabInWin(win, id);
  }

  function navigateTab(tab, url, { push = true } = {}) {
    const win = state.windows.find((w) => w.kind === 'browser' && (w.tabs || []).some((t) => t.id === tab.id)) || getFocusedBrowser();
    if (win) {
      const t = win.tabs.find((x) => x.id === tab.id) || tab;
      navigateTabInWin(win, t, url, { push });
    }
  }

  function updateOmnibox() {
    const win = getFocusedBrowser();
    if (win && win._el) renderBrowserUI(win, win._el);
  }

  function updateNavButtons() {
    updateOmnibox();
  }

  /* ── Home / about pages ── */
  function buildHomePage(tab) {
    const page = document.createElement('div');
    page.className = 'home-page';
    page.innerHTML = `
      <h1>n3xn</h1>
      <p class="sub">Virtual Operating System · Seraph theme · IndexedDB</p>
      <div class="search-big">
        <input type="text" placeholder="Search the web or type a URL" data-home-search />
        <button type="button" data-home-go>Go</button>
      </div>
      <div class="section-title">Pinned apps</div>
      <div class="apps-grid" data-home-apps></div>
      <div class="section-title">Recent</div>
      <div class="apps-grid" data-home-recent></div>
    `;
    const go = () => {
      const q = page.querySelector('[data-home-search]').value;
      if (q.trim()) navigateTab(tab, q);
    };
    page.querySelector('[data-home-go]').addEventListener('click', go);
    page.querySelector('[data-home-search]').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') go();
    });
    const appsEl = page.querySelector('[data-home-apps]');
    state.apps.filter((a) => a.shelf || a.system).slice(0, 12).forEach((app) => {
      appsEl.appendChild(makeAppTile(app, () => openApp(app)));
    });
    const recentEl = page.querySelector('[data-home-recent]');
    state.history.slice(0, 8).forEach((h) => {
      const tile = document.createElement('div');
      tile.className = 'app-tile';
      tile.innerHTML = `<div class="icon"><img src="${faviconFor(h.url)}" onerror="this.remove()" /></div><div class="name">${escapeHtml(h.title || h.url)}</div>`;
      tile.addEventListener('click', () => navigateTab(tab, h.url));
      tile.addEventListener('contextmenu', (e) => openHistoryContext(e, h));
      recentEl.appendChild(tile);
    });
    page.addEventListener('contextmenu', (e) => {
      if (e.target.closest('.app-tile')) return;
      openHomeChromeContext(e);
    });
    return page;
  }

  function buildAboutPage(tab) {
    const page = document.createElement('div');
    page.className = 'home-page';
    const kind = tab.url.replace('about:', '');
    if (kind === 'settings') {
      page.innerHTML = `<h1>Settings</h1><p class="sub">Use the shelf ⚙ button or menu for full settings.</p>`;
      setTimeout(() => openSettings(), 100);
    } else if (kind === 'calc') {
      page.innerHTML = `
        <h1>Calculator</h1>
        <div style="max-width:280px;margin:24px auto">
          <input id="calc-out" readonly style="width:100%;padding:12px;font-size:22px;text-align:right;border-radius:10px;border:1px solid var(--border-color2);background:var(--surface);margin-bottom:10px" value="0" />
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px" id="calc-keys"></div>
        </div>`;
      const keys = ['C','←','%','/','7','8','9','*','4','5','6','-','1','2','3','+','0','.','=','±'];
      const out = page.querySelector('#calc-out');
      let expr = '';
      keys.forEach((k) => {
        const b = document.createElement('button');
        b.className = 'btn';
        b.textContent = k;
        b.style.padding = '14px';
        b.addEventListener('click', () => {
          if (k === 'C') { expr = ''; out.value = '0'; return; }
          if (k === '←') { expr = expr.slice(0, -1); out.value = expr || '0'; return; }
          if (k === '=') {
            try { expr = String(Function('"use strict";return(' + expr + ')')()); out.value = expr; }
            catch { out.value = 'Error'; expr = ''; }
            return;
          }
          if (k === '±') { expr = expr.startsWith('-') ? expr.slice(1) : '-' + expr; out.value = expr; return; }
          expr += k === '×' ? '*' : k;
          out.value = expr;
        });
        page.querySelector('#calc-keys').appendChild(b);
      });
    } else if (kind === 'terminal') {
      page.innerHTML = `<h1>Terminal</h1><pre id="term-out" style="background:var(--surface);border:1px solid var(--border-color2);border-radius:10px;padding:14px;min-height:200px;max-width:700px;margin:16px auto;font-family:Inconsolata,monospace;font-size:13px"></pre>
        <div style="max-width:700px;margin:0 auto;display:flex;gap:8px"><span style="color:var(--accent)">$</span><input id="term-in" style="flex:1;background:transparent;border:none;outline:none;color:var(--text-color);font-family:Inconsolata,monospace" /></div>`;
      const out = page.querySelector('#term-out');
      const inp = page.querySelector('#term-in');
      const lines = ['n3xn shell v1 — type help'];
      const render = () => { out.textContent = lines.join('\n'); out.scrollTop = out.scrollHeight; };
      render();
      inp.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        const cmd = inp.value.trim();
        lines.push('$ ' + cmd);
        inp.value = '';
        if (cmd === 'help') lines.push('commands: help, clear, date, apps, tabs, theme, version');
        else if (cmd === 'clear') lines.length = 0;
        else if (cmd === 'date') lines.push(new Date().toString());
        else if (cmd === 'apps') lines.push(state.apps.map((a) => a.name).join(', '));
        else if (cmd === 'tabs') lines.push(state.tabs.map((t) => displayTitle(t)).join(' | '));
        else if (cmd.startsWith('theme ')) {
          applyTheme(cmd.slice(6).trim());
          lines.push('theme set');
        } else if (cmd === 'version') lines.push('n3xn Virtual OS 1.0.0');
        else if (cmd) lines.push('command not found: ' + cmd);
        render();
      });
      setTimeout(() => inp.focus(), 50);
    } else if (kind === 'files') {
      page.innerHTML = `<h1>Files</h1><p class="sub">Virtual filesystem backed by IndexedDB (export/import from Settings).</p>
        <div style="max-width:600px;margin:20px auto;background:var(--surface);border:1px solid var(--border-color2);border-radius:12px;padding:16px">
          <p>Bookmarks: ${state.bookmarks.length}</p>
          <p>History entries: ${state.history.length}</p>
          <p>Installed apps: ${state.apps.length}</p>
          <p>Open tabs: ${state.tabs.length}</p>
        </div>`;
    } else if (kind === 'store') {
      page.innerHTML = `<h1>App Store</h1><p class="sub">Install any URL as an independent app window.</p>
        <div class="apps-grid" style="max-width:800px;margin:20px auto" data-store></div>`;
      const grid = page.querySelector('[data-store]');
      state.apps.forEach((app) => grid.appendChild(makeAppTile(app, () => openApp(app))));
      const add = document.createElement('div');
      add.className = 'app-tile';
      add.innerHTML = `<div class="icon">＋</div><div class="name">Install URL…</div>`;
      add.addEventListener('click', () => openInstallApp());
      grid.appendChild(add);
    } else {
      page.innerHTML = `<h1>${escapeHtml(tab.url)}</h1><p class="sub">About page</p>`;
    }
    return page;
  }

  function makeAppTile(app, onClick) {
    const tile = document.createElement('div');
    tile.className = 'app-tile';
    const icon = document.createElement('div');
    icon.className = 'icon';
    if (app.icon && (String(app.icon).startsWith('http') || String(app.icon).startsWith('data:'))) {
      const img = document.createElement('img');
      img.src = app.icon;
      img.onerror = () => { icon.textContent = '📦'; };
      icon.appendChild(img);
    } else {
      icon.textContent = app.icon || '📦';
    }
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = app.name;
    tile.append(icon, name);
    tile.addEventListener('click', onClick);
    tile.addEventListener('contextmenu', (e) => openAppContext(e, app));
    return tile;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  /* ── History / bookmarks ── */
  function addHistory(url, title) {
    if (!url || isAbout(url)) return;
    state.history = state.history.filter((h) => h.url !== url);
    state.history.unshift({ url, title: title || url, at: Date.now() });
    if (state.history.length > 500) state.history.length = 500;
    scheduleSave();
  }

  function getFocusedBrowser() {
    const browsers = state.windows.filter((w) => w.kind === 'browser' && !w.minimized);
    if (!browsers.length) return null;
    if (state.focusedBrowserId) {
      const f = browsers.find((w) => w.id === state.focusedBrowserId);
      if (f) return f;
    }
    return browsers[browsers.length - 1];
  }


  function isUrlHidden(surface) {
    if (state.settings.hideUrlsPermanently) return true;
    if (!surface) return false;
    if (surface.cloaked || surface.cloak) return true;
    return false;
  }

  let _topZ = 20000;
  function raiseWindow(win) {
    if (!win) return;
    _topZ += 1;
    win.z = _topZ;
    state.windows.forEach((w) => {
      const el = w._el || document.querySelector(`[data-wid="${w.id}"]`);
      if (!el) return;
      el.style.zIndex = String(w.z || 20000);
    });
    const el = win._el || document.querySelector(`[data-wid="${win.id}"]`);
    if (el) el.style.zIndex = String(win.z);
    if (win.kind === 'browser') {
      state.focusedBrowserId = win.id;
      state.tabs = win.tabs || state.tabs;
      state.activeTabId = win.activeTabId;
    }
    // un-minimize if needed
    if (win.minimized) {
      win.minimized = false;
      if (el) el.classList.remove('minimized');
    }
  }

  function focusBrowser(win) {
    if (!win || win.kind !== 'browser') return;
    raiseWindow(win);
  }

  function toggleBookmark(tab) {
    tab = tab || getActiveTab();
    if (!tab || isAbout(tab.url)) return;
    const i = state.bookmarks.findIndex((b) => b.url === tab.url);
    if (i >= 0) {
      state.bookmarks.splice(i, 1);
      toast('Bookmark removed');
    } else {
      state.bookmarks.unshift({
        url: tab.url,
        title: displayTitle(tab),
        favicon: displayFavicon(tab),
        at: Date.now(),
      });
      toast('Bookmarked');
    }
    document.querySelectorAll('.bw-bookmarks').forEach((bar) => fillBookmarksBar(bar));
    scheduleSave();
  }

  function fillBookmarksBar(bar, win) {
    if (!bar) return;
    bar.classList.toggle('visible', !!state.settings.showBookmarksBar);
    bar.innerHTML = '';
    state.bookmarks.forEach((b) => {
      const chip = document.createElement('div');
      chip.className = 'bm-chip';
      chip.textContent = b.title || b.url;
      chip.title = b.url;
      chip.addEventListener('click', () => {
        if (win) {
          const tab = win.tabs.find((t) => t.id === win.activeTabId) || win.tabs[0];
          if (tab) navigateTabInWin(win, tab, b.url);
        }
      });
      chip.addEventListener('contextmenu', (e) => openBookmarkContext(e, b));
      bar.appendChild(chip);
    });
  }

  function renderBookmarksBar() {
    document.querySelectorAll('.bw-bookmarks').forEach((bar) => {
      const wid = bar.closest('.app-window')?.dataset?.wid;
      const win = state.windows.find((w) => w.id === wid);
      fillBookmarksBar(bar, win);
    });
  }

  /* ── Apps / windows ── */

  function openNrxnChatApp() {
    try {
      var bin = atob(NRXN_CHAT_B64);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var blob = new Blob([bytes], { type: 'text/html' });
      var url = URL.createObjectURL(blob);
      openAppWindow({ id: 'app-nrxn-chat', name: 'NRXN Chat', url: url, icon: '📹', cloak: false, kind: 'app' });
    } catch (e) {
      toast('NRXN Chat failed: ' + (e && e.message));
    }
  }

  function openApp(app) {
    if (app.url === 'about:settings' || app.id === 'app-settings') {
      openSettings();
      closeLauncher();
      return;
    }
    // Chrome on ChromeOS: Browser is an app — focus existing or open a new Browser window
    if (app.id === 'app-browser' || app.kind === 'browser' || app.url === 'about:browser') {
      if (!app.forceNew) {
        const existing = state.windows.find((w) => w.kind === 'browser' && !w.minimized);
        if (existing) {
          existing.minimized = false;
          const el = document.querySelector(`[data-wid="${existing.id}"]`);
          if (el) {
            el.classList.remove('minimized');
            focusBrowser(existing);
            el.style.zIndex = '20050';
          }
          closeLauncher();
          return;
        }
      }
      openAppWindow({
        ...app,
        kind: 'browser',
        name: 'Browser',
        icon: '🌐',
        url: state.settings.homepage || 'about:home',
        cloak: !!app.cloak,
      });
      closeLauncher();
      return;
    }
    openAppWindow(app);
    closeLauncher();
  }

  function openAppWindow(app) {
    const id = uid('w');
    const isBrowser = app.kind === 'browser' || app.id === 'app-browser';
    const win = {
      id,
      appId: app.id,
      name: isBrowser ? 'Browser' : (app.name || 'App'),
      url: (function(){
        var u = app.url || (isBrowser ? (state.settings.homepage || 'about:home') : 'about:blank');
        if (app.id === 'app-nrxn-chat' || u === 'about:nrxn-chat') {
          try {
            var bin = atob(NRXN_CHAT_B64);
            var bytes = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return URL.createObjectURL(new Blob([bytes], { type: 'text/html' }));
          } catch (e) { return u; }
        }
        return u;
      })(),
      icon: app.icon || (isBrowser ? '🌐' : '📦'),
      kind: isBrowser ? 'browser' : (app.kind || 'app'),
      cloak: !!app.cloak,
      brightness: 1,
      contrast: 1,
      saturate: 1,
      glass: true,
      x: isBrowser ? 48 : 60 + (state.windows.length % 7) * 32,
      y: isBrowser ? 36 : 48 + (state.windows.length % 7) * 28,
      w: isBrowser ? Math.min(1100, window.innerWidth - 80) : 900,
      h: isBrowser ? Math.min(720, window.innerHeight - 100) : 600,
      maximized: isBrowser,
      minimized: false,
      z: 0,
      tabs: [],
      activeTabId: null,
      _iframe: null,
      _dtInjected: false,
      _el: null,
    };
    state.windows.push(win);
    if (isBrowser) {
      // Seed first tab from shared/persisted tabs if this is first browser
      const seed = (state.tabs && state.tabs.length)
        ? state.tabs.map((t) => ({ ...t, _iframe: null, _wrap: null, _dtInjected: false }))
        : null;
      if (seed && seed.length) {
        win.tabs = seed;
        win.activeTabId = state.activeTabId && seed.some((t) => t.id === state.activeTabId)
          ? state.activeTabId
          : seed[0].id;
        state.tabs = win.tabs;
        state.activeTabId = win.activeTabId;
      } else {
        const tab = createTabForWin(win, { url: win.url });
        win.activeTabId = tab.id;
      }
      state.focusedBrowserId = win.id;
    }
    renderWindow(win);
  }

  function createTabForWin(win, opts = {}) {
    const tab = {
      id: opts.id || uid('t'),
      url: normalizeUrl(opts.url != null ? opts.url : (state.settings.homepage || 'about:home')),
      title: opts.title || '',
      customTitle: opts.customTitle || null,
      favicon: opts.favicon || null,
      customFavicon: opts.customFavicon || null,
      cloaked: opts.cloaked != null ? opts.cloaked : !!state.settings.cloakNewTabs,
      invisible: opts.invisible != null ? opts.invisible : !!state.settings.invisibleNewTabs,
      allow: opts.allow != null ? opts.allow : state.settings.defaultAllow,
      allowFullscreen: opts.allowFullscreen != null ? opts.allowFullscreen : !!state.settings.allowFullscreen,
      brightness: opts.brightness != null ? opts.brightness : 1,
      contrast: opts.contrast != null ? opts.contrast : 1,
      saturate: opts.saturate != null ? opts.saturate : 1,
      glass: opts.glass != null ? opts.glass : true,
      isHome: false,
      historyStack: [],
      historyIndex: -1,
      _iframe: null,
      _wrap: null,
      _dtInjected: false,
      winId: win.id,
    };
    if (tab.url === 'about:home' || tab.url === 'about:browser') {
      tab.isHome = true;
      tab.url = 'about:home';
    }
    if (tab.invisible) {
      if (!tab.customTitle) tab.customTitle = ZWS;
      if (!tab.customFavicon) tab.customFavicon = INVISIBLE_FAVICON;
    } else if (tab.cloaked) {
      if (!tab.customTitle && state.settings.cloakTitle) tab.customTitle = state.settings.cloakTitle;
      if (!tab.customFavicon && state.settings.cloakFavicon) tab.customFavicon = state.settings.cloakFavicon;
    }
    win.tabs.push(tab);
    return tab;
  }

  function navigateTabInWin(win, tab, rawUrl, { push = true } = {}) {
    let url = normalizeUrl(rawUrl);
    if (url === 'about:nrxn-chat' || (rawUrl && String(rawUrl).indexOf('about:nrxn-chat') === 0)) {
      try {
        var bin = atob(NRXN_CHAT_B64);
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        url = URL.createObjectURL(new Blob([bytes], { type: 'text/html' }));
      } catch (e) { console.warn(e); }
    }
    tab.url = url;
    tab.isHome = url === 'about:home';
    if (!tab.customTitle) tab.title = '';
    if (!tab.customFavicon) tab.favicon = faviconFor(url);
    if (tab._wrap) {
      tab._wrap.remove();
      tab._wrap = null;
      tab._iframe = null;
      tab._dtInjected = false;
    }
    if (push) {
      tab.historyStack = (tab.historyStack || []).slice(0, tab.historyIndex + 1);
      tab.historyStack.push(url);
      tab.historyIndex = tab.historyStack.length - 1;
    }
    const el = win._el || document.querySelector(`[data-wid="${win.id}"]`);
    if (el) {
      ensureFrameInWin(win, tab, el);
      renderBrowserUI(win, el);
    }
    addHistory(url, displayTitle(tab));
    scheduleSave();
  }

  function renderWindow(win) {
    const root = document.getElementById('app-windows');
    let el = root.querySelector(`[data-wid="${win.id}"]`);
    if (!el) {
      el = document.createElement('div');
      const isBrowser = win.kind === 'browser';
      el.className = 'app-window' + (isBrowser ? ' browser-app' : '');
      el.dataset.wid = win.id;
      el.innerHTML = `
        <div class="win-titlebar">
          <span class="win-icon"></span>
          <span class="win-name"></span>
          <div class="win-ctrls">
            <button class="chrome-menu-btn win-menu" title="Window menu">⋮</button>
            <button class="win-min" title="Minimize">—</button>
            <button class="win-max" title="Maximize">□</button>
            <button class="win-close" title="Close">✕</button>
          </div>
        </div>
        <div class="win-body"></div>
        <div class="resize-handle"></div>`;
      root.appendChild(el);
      win._el = el;

      const bar = el.querySelector('.win-titlebar');
      let drag = null;
      bar.addEventListener('mousedown', (e) => {
        if (e.target.closest('button') || e.target.closest('input') || win.maximized) return;
        drag = { ox: e.clientX - win.x, oy: e.clientY - win.y };
        e.preventDefault();
        raiseWindow(win);
      });
      el.addEventListener('mousedown', () => raiseWindow(win));
      window.addEventListener('mousemove', (e) => {
        if (!drag) return;
        win.x = Math.max(0, e.clientX - drag.ox);
        win.y = Math.max(0, e.clientY - drag.oy);
        layoutWindow(win, el);
      });
      window.addEventListener('mouseup', () => { drag = null; });

      el.querySelector('.win-close').addEventListener('click', () => {
        (win.tabs || []).forEach((t) => { if (t._wrap) t._wrap.remove(); });
        el.remove();
        state.windows = state.windows.filter((w) => w.id !== win.id);
        if (state.focusedBrowserId === win.id) state.focusedBrowserId = null;
      });
      el.querySelector('.win-min').addEventListener('click', () => {
        win.minimized = true;
        el.classList.add('minimized');
      });
      el.querySelector('.win-max').addEventListener('click', () => {
        win.maximized = !win.maximized;
        el.classList.toggle('maximized', win.maximized);
        layoutWindow(win, el);
      });
      el.querySelector('.win-menu').addEventListener('click', (e) => {
        e.stopPropagation();
        openSurfaceMenu(e, { type: 'window', win, el });
      });

      const handle = el.querySelector('.resize-handle');
      let resizing = null;
      handle.addEventListener('mousedown', (e) => {
        resizing = { ox: e.clientX, oy: e.clientY, ow: win.w, oh: win.h };
        e.preventDefault();
        e.stopPropagation();
      });
      window.addEventListener('mousemove', (e) => {
        if (!resizing) return;
        win.w = Math.max(280, resizing.ow + (e.clientX - resizing.ox));
        win.h = Math.max(180, resizing.oh + (e.clientY - resizing.oy));
        layoutWindow(win, el);
      });
      window.addEventListener('mouseup', () => { resizing = null; });

      const body = el.querySelector('.win-body');
      if (isBrowser) {
        body.innerHTML = `
          <div class="browser-chrome">
            <div class="bw-tabstrip">
              <button class="bw-new-tab" id="" title="New tab" style="width:28px;height:28px;border-radius:6px;color:var(--muted);font-size:18px">+</button>
            </div>
            <div class="bw-toolbar">
              <button class="tb-btn bw-back" title="Back">←</button>
              <button class="tb-btn bw-fwd" title="Forward">→</button>
              <button class="tb-btn bw-reload" title="Reload">↻</button>
              <div class="bw-omni-wrap">
                <span class="omni-icon bw-lock">🔒</span>
                <input class="bw-omni" type="text" spellcheck="false" placeholder="Search or enter URL" />
              </div>
              <button class="tb-btn bw-star" title="Bookmark">☆</button>
              <button class="tb-btn bw-more" title="Menu">⋮</button>
            </div>
            <div class="bw-bookmarks"></div>
            <div class="bw-content"></div>
          </div>`;
        const omni = el.querySelector('.bw-omni');
        const go = () => {
          const tab = win.tabs.find((t) => t.id === win.activeTabId) || win.tabs[0];
          if (tab) navigateTabInWin(win, tab, omni.value);
        };
        omni.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
        el.querySelector('.bw-new-tab').addEventListener('click', () => {
          const t = createTabForWin(win, { url: 'about:home' });
          win.activeTabId = t.id;
          renderBrowserUI(win, el);
        });
        el.querySelector('.bw-back').addEventListener('click', () => {
          const tab = win.tabs.find((t) => t.id === win.activeTabId);
          if (!tab || tab.historyIndex <= 0) return;
          tab.historyIndex--;
          navigateTabInWin(win, tab, tab.historyStack[tab.historyIndex], { push: false });
        });
        el.querySelector('.bw-fwd').addEventListener('click', () => {
          const tab = win.tabs.find((t) => t.id === win.activeTabId);
          if (!tab || tab.historyIndex >= tab.historyStack.length - 1) return;
          tab.historyIndex++;
          navigateTabInWin(win, tab, tab.historyStack[tab.historyIndex], { push: false });
        });
        el.querySelector('.bw-reload').addEventListener('click', () => {
          const tab = win.tabs.find((t) => t.id === win.activeTabId);
          if (tab) navigateTabInWin(win, tab, tab.url, { push: false });
        });
        el.querySelector('.bw-star').addEventListener('click', () => {
          const tab = win.tabs.find((t) => t.id === win.activeTabId);
          toggleBookmark(tab);
        });
        el.querySelector('.bw-more').addEventListener('click', (e) => {
          e.stopPropagation();
          openSurfaceMenu(e, { type: 'window', win, el });
        });
        if (!win.tabs.length) {
          const t = createTabForWin(win, { url: state.settings.homepage || 'about:home' });
          win.activeTabId = t.id;
        }
        renderBrowserUI(win, el);
        if (win.maximized) el.classList.add('maximized');
      } else {
        if (isAbout(win.url)) {
          body.appendChild(buildAboutPage({ url: win.url, id: win.id }));
        } else {
          const iframe = document.createElement('iframe');
          iframe.src = win.url;
          iframe.setAttribute('allow', state.settings.defaultAllow || DEFAULT_ALLOW);
          iframe.setAttribute('sandbox', state.settings.defaultSandbox || DEFAULT_SANDBOX);
          iframe.setAttribute('referrerpolicy', 'no-referrer');
          if (state.settings.allowFullscreen) iframe.setAttribute('allowfullscreen', '');
          iframe.setAttribute('data-blocksi-src', state.settings.blocksiFakeSrc || BLOCKSI_FAKE_SRC);
          iframe.setAttribute('data-blocksi-processed', state.settings.blocksiProcessed || BLOCKSI_PROC);
          iframe.addEventListener('load', () => {
            tryInjectDevtoolsIntoFrame(iframe, win);
            injectAntiBlocksiIntoFrame(iframe);
          });
          win._iframe = iframe;
          body.appendChild(iframe);
        }
      }
    }
    win._el = el;
    if (isUrlHidden(win) || win.kind === 'browser') {
      el.querySelector('.win-name').textContent = win.name || (win.kind === 'browser' ? 'Browser' : 'App');
    } else {
      el.querySelector('.win-name').textContent = (win.name || 'App') + ' — ' + win.url;
    }
    const iconEl = el.querySelector('.win-icon');
    if (win.icon && (String(win.icon).startsWith('http') || String(win.icon).startsWith('data:'))) {
      iconEl.innerHTML = `<img src="${win.icon}" style="width:16px;height:16px;border-radius:3px" />`;
    } else {
      iconEl.textContent = win.icon || '📦';
    }
    applySurfaceFilter(el, win);
    layoutWindow(win, el);
    raiseWindow(win);
  }

  function layoutWindow(win, el) {
    if (win.maximized) {
      el.style.left = '0';
      el.style.top = '0';
      el.style.width = '100%';
      el.style.height = '';
      return;
    }
    el.style.left = win.x + 'px';
    el.style.top = win.y + 'px';
    el.style.width = win.w + 'px';
    el.style.height = win.h + 'px';
  }

  /* ── Shelf / launcher ── */
  function renderShelf() {
    const box = document.getElementById('shelf-apps');
    box.innerHTML = '';
    state.apps.filter((a) => a.shelf).forEach((app) => {
      const btn = document.createElement('button');
      btn.className = 'shelf-btn';
      btn.title = app.name;
      if (app.icon && (String(app.icon).startsWith('http') || String(app.icon).startsWith('data:'))) {
        btn.innerHTML = `<img src="${app.icon}" style="width:22px;height:22px;border-radius:6px" />`;
      } else {
        btn.textContent = app.icon || '📦';
      }
      btn.addEventListener('click', () => openApp(app));
      btn.addEventListener('contextmenu', (e) => openAppContext(e, app));
      box.appendChild(btn);
    });
  }

  function openLauncher() {
    document.getElementById('launcher').classList.add('open');
    const grid = document.getElementById('launcher-grid');
    grid.innerHTML = '';
    state.apps.forEach((app) => grid.appendChild(makeAppTile(app, () => openApp(app))));
    document.getElementById('launcher-search').value = '';
    document.getElementById('launcher-search').focus();
  }
  function closeLauncher() {
    document.getElementById('launcher').classList.remove('open');
  }

  /* ── Settings / theme ── */
  function applyTheme(id) {
    THEMES.forEach((t) => {
      if (t.id) document.documentElement.classList.remove(t.id);
    });
    if (id) document.documentElement.classList.add(id);
    state.settings.theme = id || '';
    scheduleSave();
    document.querySelectorAll('.swatch').forEach((s) => {
      s.classList.toggle('active', (s.dataset.theme || '') === (id || ''));
    });
  }

  function openSettings() {
    const m = document.getElementById('modal-settings');
    const s = state.settings;
    document.getElementById('set-search').value = s.searchEngine;
    document.getElementById('set-homepage').value = s.homepage || '';
    document.getElementById('set-bmbar').checked = !!s.showBookmarksBar;
    document.getElementById('set-cloak-default').checked = !!s.cloakNewTabs;
    var inv = document.getElementById('set-invisible-default');
    if (inv) inv.checked = !!s.invisibleNewTabs;
    var ab = document.getElementById('set-anti-blocksi');
    if (ab) ab.checked = s.antiBlocksi !== false;
    var ct = document.getElementById('set-cloak-title');
    if (ct) ct.value = s.cloakTitle || DEFAULT_CLOAK_TITLE;
    var cf = document.getElementById('set-cloak-favicon');
    if (cf) cf.value = s.cloakFavicon || DEFAULT_CLOAK_FAVICON;
    var bs = document.getElementById('set-blocksi-src');
    if (bs) bs.value = s.blocksiFakeSrc || BLOCKSI_FAKE_SRC;
    document.getElementById('set-hide-urls').checked = !!s.hideUrlsPermanently;
    document.getElementById('set-allow').value = s.defaultAllow || DEFAULT_ALLOW;
    document.getElementById('set-allowfs').checked = !!s.allowFullscreen;
    document.getElementById('set-glass').checked = s.glass !== false;
    document.getElementById('set-prompt-fs').checked = s.promptFullscreen !== false;
    document.getElementById('set-inject-dt').checked = s.injectDevtoolsIntoFrames !== false;
    document.getElementById('set-desktop-bg').value = s.desktopBg || '';
    document.getElementById('set-desktop-fit').value = s.desktopFit || 'cover';
    document.getElementById('set-desktop-pos').value = s.desktopPos || 'center';
    document.getElementById('set-desktop-brightness').value = s.desktopBrightness != null ? s.desktopBrightness : 1;
    document.getElementById('set-desktop-blur').value = s.desktopBlur || 0;
    document.getElementById('set-desktop-dim').value = s.desktopDim != null ? s.desktopDim : 0.35;
    document.getElementById('set-glass-blur').value = s.glassBlur != null ? s.glassBlur : 16;
    document.getElementById('set-glass-opacity').value = s.glassOpacity != null ? s.glassOpacity : 0.72;
    document.getElementById('lbl-db').textContent = document.getElementById('set-desktop-brightness').value;
    document.getElementById('lbl-dbl').textContent = document.getElementById('set-desktop-blur').value;
    document.getElementById('lbl-dd').textContent = document.getElementById('set-desktop-dim').value;
    document.getElementById('lbl-gb').textContent = document.getElementById('set-glass-blur').value;
    document.getElementById('lbl-go').textContent = document.getElementById('set-glass-opacity').value;
    const sw = document.getElementById('theme-swatches');
    sw.innerHTML = '';
    THEMES.forEach((t) => {
      const b = document.createElement('button');
      b.className = 'swatch' + ((s.theme || '') === t.id ? ' active' : '');
      b.style.background = t.color;
      b.dataset.theme = t.id;
      b.title = t.name;
      b.addEventListener('click', () => applyTheme(t.id));
      sw.appendChild(b);
    });
    m.classList.add('open');
  }

  function closeModals() {
    document.querySelectorAll('.modal-backdrop').forEach((m) => m.classList.remove('open'));
  }

  /* ── Unified context menus (OS chrome only — never on iframes) ── */
  let _genEditSave = null;

  function hideCtx() {
    const m = document.getElementById('ctx-menu');
    if (m) m.classList.remove('open');
  }

  function showContextMenu(e, items) {
    e.preventDefault();
    e.stopPropagation();
    hideCtx();
    const menu = document.getElementById('ctx-menu');
    menu.innerHTML = '';
    let count = 0;
    (items || []).forEach((it) => {
      if (!it) return;
      if (it.sep) {
        const s = document.createElement('div');
        s.className = 'ctx-sep';
        menu.appendChild(s);
        return;
      }
      if (it.disabled) return;
      const d = document.createElement('div');
      d.className = 'ctx-item' + (it.danger ? ' danger' : '');
      d.textContent = it.label;
      d.addEventListener('click', (ev) => {
        ev.stopPropagation();
        hideCtx();
        try { it.fn && it.fn(); } catch (err) { console.warn(err); toast(String(err.message || err)); }
      });
      menu.appendChild(d);
      count++;
    });
    if (!count) return;
    const pad = 8;
    const mw = 220;
    const mh = Math.min(count * 36 + 20, window.innerHeight - 20);
    let x = e.clientX;
    let y = e.clientY;
    if (x + mw > window.innerWidth - pad) x = window.innerWidth - mw - pad;
    if (y + mh > window.innerHeight - pad) y = window.innerHeight - mh - pad;
    menu.style.left = Math.max(pad, x) + 'px';
    menu.style.top = Math.max(pad, y) + 'px';
    menu.classList.add('open');
  }

  function openGenericEdit(title, fields, onSave) {
    document.getElementById('gen-edit-title').textContent = title;
    const body = document.getElementById('gen-edit-body');
    body.innerHTML = '';
    const values = {};
    fields.forEach((f) => {
      const wrap = document.createElement('div');
      wrap.className = 'field';
      const lab = document.createElement('label');
      lab.textContent = f.label;
      wrap.appendChild(lab);
      if (f.type === 'checkbox') {
        const lab2 = document.createElement('label');
        lab2.className = 'chk';
        const inp = document.createElement('input');
        inp.type = 'checkbox';
        inp.checked = !!f.value;
        inp.id = 'gen-f-' + f.key;
        lab2.append(inp, document.createTextNode(' ' + (f.checkLabel || f.label)));
        wrap.innerHTML = '';
        wrap.appendChild(lab2);
        values[f.key] = () => inp.checked;
      } else {
        const inp = document.createElement(f.type === 'textarea' ? 'textarea' : 'input');
        if (f.type !== 'textarea') inp.type = f.type || 'text';
        inp.id = 'gen-f-' + f.key;
        inp.value = f.value != null ? f.value : '';
        inp.placeholder = f.placeholder || '';
        wrap.appendChild(inp);
        values[f.key] = () => inp.value;
      }
      body.appendChild(wrap);
    });
    _genEditSave = () => {
      const data = {};
      Object.keys(values).forEach((k) => { data[k] = values[k](); });
      onSave(data);
      closeModals();
    };
    document.getElementById('modal-generic-edit').classList.add('open');
  }

  function openTabContext(e, tab) {
    showContextMenu(e, [
      { label: 'Reload', fn: () => navigateTab(tab, tab.url, { push: false }) },
      { label: tab.cloaked ? 'Uncloak tab' : 'Cloak Tab…', fn: () => cloakTab(tab) },
      { label: tab.invisible ? 'Disable invisible tab' : 'Invisible tab (ZWS + clear favicon)', fn: () => makeInvisibleTab(tab) },
      { label: 'Edit title / favicon…', fn: () => openTabEdit(tab) },
      { label: 'Tab menu (⋮)…', fn: () => openSurfaceMenu(e, { type: 'tab', tab }) },
      { label: 'Fullscreen tab', fn: () => requestFs(tab._iframe || tab._wrap) },
      { label: 'Duplicate', fn: () => { const t = createTab({ url: tab.url, cloaked: tab.cloaked, invisible: tab.invisible, allow: tab.allow, allowFullscreen: tab.allowFullscreen, customTitle: tab.customTitle, customFavicon: tab.customFavicon }); activateTab(t.id); } },
      { label: 'Open in new tab', fn: () => { const t = createTab({ url: tab.url }); activateTab(t.id); } },
      { label: 'Open proxied in AB-cloaked window', fn: () => openUrlInCloakedTab(tab.url) },
      { label: 'Full max tab cloaker embed', fn: () => openMaxTabCloaker(tab.url) },
      { label: 'Full max tab cloaker (invisible)', fn: () => openMaxTabCloaker(tab.url, { invisible: true }) },
      { label: 'Open OS in AB-cloaked window', fn: () => openOsInCloakedTab() },
